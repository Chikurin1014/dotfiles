[tools]
'aqua:github/copilot-cli' = 'latest'
'aqua:tealdeer-rs/tealdeer' = 'latest'
"github:Feel-ix-343/markdown-oxide" = "latest"
# Installed by Nix on the other systems. postinstall exposes the native binary (see the script).
"npm:@github/copilot-language-server" = { version = 'latest', os = ['windows'], postinstall = 'pwsh -NoProfile -File "%USERPROFILE%\.config\mise\scripts\link-copilot-language-server.ps1"' }

bat = 'latest'
btop = { version = 'latest', os = ['linux'] } # Not available on Windows and macOS via aqua
difftastic = 'latest'
dust = 'latest'
eza = 'latest'
fd = 'latest'
fzf = 'latest'
ghq = 'latest'
github-cli = 'latest'
lazygit = 'latest'
node = 'lts'
ripgrep = 'latest'
sd = 'latest'
starship = 'latest'
tree-sitter = 'latest'
yazi = 'latest'
zellij = 'latest'
zoxide = 'latest'

[settings]
plugin_autoupdate_last_check_duration = '1 week'
