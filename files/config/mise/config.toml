[tools]
'aqua:github/copilot-cli' = 'latest'
'aqua:tealdeer-rs/tealdeer' = 'latest'
"github:Feel-ix-343/markdown-oxide" = "latest"
# postinstall exposes the native binary (see the script)
"npm:@github/copilot-language-server" = { version = 'latest', postinstall = 'node "{{xdg_config_home}}/mise/scripts/link-copilot-language-server.js"' }

bat = 'latest'
btop = { version = 'latest', os = ['linux'] } # Not available on Windows and macOS via aqua
difftastic = 'latest'
dust = 'latest'
eza = 'latest'
fd = 'latest'
fzf = 'latest'
ghq = 'latest'
github-cli = 'latest'
lazygit = 'latest'
node = 'lts'
ripgrep = 'latest'
sd = 'latest'
starship = 'latest'
tree-sitter = 'latest'
yazi = 'latest'
zellij = 'latest'
zoxide = 'latest'
