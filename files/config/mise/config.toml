[tools]
'aqua:github/copilot-cli' = '1.0.109'
'aqua:tealdeer-rs/tealdeer' = '1.9.1'
# The default backend (vfox) of eza records no checksums and host-dependent URLs in mise.lock
'aqua:eza-community/eza' = { version = '0.23.5', os = ['linux', 'windows'] } # No binary for macOS
"github:Feel-ix-343/markdown-oxide" = "0.25.12"
# postinstall exposes the native binary (see the script)
"npm:@github/copilot-language-server" = { version = '1.569.0', postinstall = 'node "{{xdg_config_home}}/mise/scripts/link-copilot-language-server.js"' }

bat = '0.26.1'
btop = { version = '1.4.8', os = ['linux'] } # Not available on Windows and macOS via aqua
difftastic = '0.72.0'
dust = '1.2.7'
fd = '10.5.2'
fzf = '0.75.0'
ghq = '1.12.0'
github-cli = '2.103.3'
lazygit = '0.66.3'
node = '24.22.0' # LTS
ripgrep = '15.2.0'
sd = '1.1.0'
starship = '1.27.0'
tree-sitter = '0.27.2'
yazi = '26.9.1'
zellij = '0.46.0'
zoxide = '0.10.0'
