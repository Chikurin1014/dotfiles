name: dotfiles

services:
  playground:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    volumes:
      - type: bind
        source: .
        target: /home/ubuntu/dotfiles
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      EDITOR: ${EDITOR}
    tty: true
