name: dotfiles

services:
  playground:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # If the UID/GID of the host user are not 1000, set them in `.env` (not tracked)
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - type: bind
        source: .
        target: /home/ubuntu/dotfiles
    tty: true
