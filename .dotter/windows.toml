[windows]
depends = ["git-windows", "latex", "nushell", "vcxsrv", "wsl", "override"]

[git-windows.files]
# windows.gitconfig reads values from user.toml (Dotter must be run in the repository root)
"files/override/windows/config/git/windows.gitconfig" = { target = "~/.config/git/windows.gitconfig", type = "template" }

[latex.files]
"files/override/windows/latexmkrc" = "~/.latexmkrc"
"files/override/windows/indentconfig.yaml" = "~/.indentconfig.yaml"
"files/override/windows/AppData/Local/latexindent/default.yaml" = "~/AppData/Local/latexindent/default.yaml"
"files/override/windows/AppData/Roaming/tex-fmt/tex-fmt.toml" = "~/AppData/Roaming/tex-fmt/tex-fmt.toml"

[nushell.files]
# config.nu reads values from user.toml (Dotter must be run in the repository root)
"files/override/windows/AppData/Roaming/nushell/config.nu" = { target = "~/AppData/Roaming/nushell/config.nu", type = "template" }
"files/override/windows/AppData/Roaming/nushell/vendor" = "~/AppData/Roaming/nushell/vendor"

[vcxsrv.files]
"files/override/windows/config.xlaunch" = "~/.config.xlaunch"

[wsl.files]
"files/override/windows/wslconfig" = "~/.wslconfig"

# ---- Override default packages ----
[override]
depends = ["helix", "lazygit", "nvim-config", "zed", "zellij"]

[helix.files]
"files/config/helix" = "~/AppData/Roaming/helix"

[lazygit.files]
"files/config/lazygit" = "~/AppData/Local/lazygit"

[neovide.files] # `nvim-config` dependant
"nvim-config/neovide" = "~/AppData/Roaming/neovide"

[neovim.files] # `nvim-config` dependant
"nvim-config/nvim" = "~/AppData/Local/nvim"

[zed.files]
"files/config/zed" = "~/AppData/Roaming/zed"

[zellij.files]
"files/config/zellij" = "~/AppData/Roaming/Zellij"
